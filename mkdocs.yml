site_name: Bach for Google Ads
site_url: https://github.com/google-marketing-solutions/bach
repo_name: bach
repo_url: https://github.com/google-marketing-solutions/bach
copyright: Copyright Google 2025

theme:
  name: material
  font:
    text: Google Sans
    code: Roboto Mono
  palette:
    - scheme: default
      primary: white
      accent: white
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: white
      accent: white
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.footer
    - navigation.tracking
    - navigation.top
    - navigation.path
    - content.code.annotate
    - content.code.select
    - content.code.copy
    - content.tabs.link
markdown_extensions:
  - md_in_html
  - attr_list
  - admonition
  - pymdownx.details
  - pymdownx.blocks.tab:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

nav:
  - Home: index.md
  - Get Started:
     - Installation: get-started/installation.md
     - Quickstart: get-started/quickstart.md
  - Core:
     - Overview: core/overview.md
     - Rules: core/rules.md
     - Actors: core/actors.md
     - Queries: core/queries.md
     - Notifications: core/notifications.md
  - Extending Bach:
     - Actors: extending/actors.md
     - Queries: extending/queries.md
     - Notifications: extending/notifications.md
